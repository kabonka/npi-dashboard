<title>NPI Dashboard 2 - List View</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#eeeeee;
  --border:#dddddd;--text:#333333;--text2:#666666;
  --kickoff:#4472C4;--design:#00B0F0;--dvt:#7030A0;--evt:#ED7D31;
  --mvt:#FF4444;--ats:#70AD47;--study:#FFC000;--mp:#FF69B4;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}

.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border)}
.header h1{font-size:18px;font-weight:600;color:#333}
.header .date{font-size:12px;color:var(--text2)}

.stats{display:flex;gap:10px;padding:12px 24px;flex-wrap:wrap}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:90px;text-align:center;cursor:pointer;transition:.2s}
.stat-card:hover{border-color:#555}
.stat-card .label{font-size:11px;color:var(--text2);margin-bottom:2px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card.active{border-color:#333;background:var(--bg3)}
.sc-model .value{color:#333}
.sc-design .value{color:var(--design)}
.sc-dvt .value{color:var(--dvt)}.sc-evt .value{color:var(--evt)}
.sc-mvt .value{color:var(--mvt)}.sc-ats .value{color:var(--ats)}
.sc-study .value{color:var(--study)}
.sc-pending .value{color:#8899aa}
.sc-bto- .value{color:#00bcd4}
.sc-ats- .value{color:#66bb6a}
.sc-mp .value{color:var(--mp)}

.filters{display:flex;gap:8px;padding:0 24px 10px;align-items:center;flex-wrap:wrap}
.filters label{font-size:11px;color:var(--text2)}
.filters input{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:12px;outline:none}
.filters input:focus{border-color:#666}
.search-input{width:180px}

/* Multi-select dropdown */
.ms-wrap{position:relative;display:inline-block;vertical-align:middle}
.ms-btn{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;cursor:pointer;min-width:120px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:6px;user-select:none;transition:.15s}
.ms-btn:hover{border-color:#666}
.ms-btn .ms-arrow{font-size:8px;color:var(--text2);transition:transform .2s}
.ms-btn.open .ms-arrow{transform:rotate(180deg)}
.ms-btn .ms-count{font-size:9px;background:var(--bg3);color:var(--text2);padding:1px 5px;border-radius:8px;margin-left:auto}
.ms-panel{position:absolute;top:100%;left:0;min-width:160px;max-height:220px;overflow-y:auto;background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-top:4px;z-index:20;display:none;box-shadow:0 6px 18px rgba(0,0,0,.4);padding:4px 0}
.ms-panel.show{display:block}
.ms-opt{display:flex;align-items:center;gap:7px;padding:6px 10px;font-size:11px;color:var(--text);cursor:pointer;transition:.1s}
.ms-opt:hover{background:var(--bg3)}
.ms-opt.all-opt{border-bottom:1px solid var(--border);margin-bottom:2px;font-weight:600}
.ms-check{width:14px;height:14px;border:1.5px solid var(--text2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;flex-shrink:0;transition:.1s}
.ms-opt.checked .ms-check{background:#333;border-color:#333;color:#fff}

.sort-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.sort-btn.active{border-color:#333;color:#fff;background:#333}
.reset-btn{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:5px;padding:5px 10px;font-size:11px;cursor:pointer}

.list-section{padding:0 24px 16px}
.list-container{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.list-header{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border)}
.list-header h2{font-size:13px;font-weight:600}
.list-scroll{overflow-x:auto}

.list-table{border-collapse:collapse;width:100%}
.list-table thead th{position:sticky;top:0;z-index:5;background:var(--bg3);font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}

/* Sticky fixed columns */
.list-table thead th.col-model{position:sticky;left:0;z-index:10;width:80px;min-width:80px;max-width:80px}
.list-table thead th.col-toggle{position:sticky;left:80px;z-index:10;width:30px;min-width:30px;max-width:30px;text-align:center;padding:0}
.list-table thead th.col-stage{position:sticky;left:110px;z-index:10;width:65px;min-width:65px;max-width:65px}
.list-table thead th.col-mkt{position:sticky;left:175px;z-index:10;width:200px;min-width:200px;max-width:200px}
.list-table thead th.col-kickoff{width:92px;min-width:92px}
.list-table thead th.col-mp{width:92px;min-width:92px}
.list-table thead th.col-status{width:280px;min-width:200px}
.list-table thead th.col-hl{width:280px;min-width:200px}

.list-table tbody tr{border-bottom:1px solid rgba(0,0,0,.06);transition:.15s}
.list-table tbody tr:hover{background:rgba(0,0,0,.03)}
.list-table tbody tr.child-row{display:none}
.list-table tbody tr.child-row.open{display:table-row}
.list-table tbody tr.child-row td{color:var(--text2);font-size:11px}

.list-table tbody td{padding:6px 8px;font-size:11px;vertical-align:top}
.list-table tbody td.col-model{position:sticky;left:0;z-index:3;background:var(--bg2);font-weight:600;color:#333;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.list-table tbody tr:hover td.col-model{background:var(--bg3)}
.list-table tbody td.col-model.mp-changed{background:#dc2626;color:#fff;animation:mp-pulse 1.5s ease-in-out infinite}
.list-table tbody tr:hover td.col-model.mp-changed{background:#b91c1c;color:#fff}
.list-table tbody td.col-toggle{position:sticky;left:80px;z-index:3;background:var(--bg2);text-align:center;padding:0;cursor:pointer;font-size:14px;color:var(--text2);user-select:none;vertical-align:middle}
.list-table tbody td.col-toggle:hover{color:#333}
.list-table tbody tr:hover td.col-toggle{background:var(--bg3)}
.list-table tbody td.col-stage{position:sticky;left:110px;z-index:3;background:var(--bg2);max-width:65px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.list-table tbody tr:hover td.col-stage{background:var(--bg3)}
.list-table tbody td.col-mkt{position:sticky;left:175px;z-index:3;background:var(--bg2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.list-table tbody tr:hover td.col-mkt{background:var(--bg3)}
.list-table tbody td.col-kickoff,.list-table tbody td.col-mp{font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:middle}
.list-table tbody td.col-status,.list-table tbody td.col-hl{max-width:320px;word-break:break-word;white-space:pre-wrap;line-height:1.5}
.list-table tbody tr.model-alt td{background:rgba(0,0,0,.03)}
.list-table tbody tr.model-alt:hover td{background:rgba(0,0,0,.06)}

.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:600;color:#fff}
.badge-kickoff{background:var(--kickoff)}.badge-design{background:var(--design)}
.badge-dvt{background:var(--dvt)}.badge-evt{background:var(--evt)}
.badge-mvt{background:var(--mvt)}.badge-ats{background:var(--ats)}.badge-study{background:var(--study)}

.tooltip{position:fixed;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;z-index:100;pointer-events:none;display:none;max-width:280px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip .tt-model{font-size:13px;font-weight:700;color:#333;margin-bottom:4px}
.tooltip .tt-row{display:flex;gap:6px;margin:2px 0}
.tooltip .tt-label{color:var(--text2);min-width:60px}
.tooltip .tt-val{color:var(--text)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;justify-content:center;align-items:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text2);font-size:24px;cursor:pointer;line-height:1;z-index:10}
.modal-close:hover{color:#333}
.modal-body{padding:24px}
.modal-body .hdr{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.modal-body .hdr h2{color:#333;font-size:20px;font-weight:600;margin-bottom:4px}
.modal-body .hdr .mkt{color:var(--text2);font-size:13px}
.modal-body .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.modal-body .field{background:var(--bg3);padding:12px;border-radius:6px;border:1px solid var(--border)}
.modal-body .field-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.modal-body .field-value{font-size:14px;color:var(--text);font-weight:500}
.modal-body .section{margin-bottom:16px}
.modal-body .section-title{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.modal-body .section-body{background:var(--bg3);padding:12px;border-radius:6px;border:1px solid var(--border);font-size:13px;line-height:1.6;word-break:break-word}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
</style>

</div>

<div class="list-section">
  <div class="list-container">
    <div class="list-header">
      <h2>Project Timeline</h2>
      <span style="font-size:11px;color:var(--text2);margin-left:10px" id="visibleCount"></span>
    </div>
    <div class="list-scroll">
      <table class="list-table">
        <thead id="listThead"></thead>
        <tbody id="listTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetail()">&times;</button>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

    if(!_minDate || d < _minDate) _minDate = d;
    if(!_maxDate || d > _maxDate) _maxDate = d;
  }

function getGrouped(){
  // Group by model, pick parent = earliest MP (if tie, smallest orig_idx)
  const map = {};
  DATA.records.forEach(r=>{
    if(!map[r.model]) map[r.model] = [];
    map[r.model].push(r);
  });
  // For each group, sort by mp_sort then highlight length desc then orig_idx, first = parent
  const hlLen = r => (r.highlight && r.highlight !== '.') ? r.highlight.length : 0;
  Object.values(map).forEach(arr=>arr.sort((a,b)=>a.mp_sort.localeCompare(b.mp_sort) || hlLen(b)-hlLen(a) || a.orig_idx-b.orig_idx));
  return map;
}

function getFilteredGroups(){
  const allGroups = getGrouped();
  const result = {};
  for(const [model, rows] of Object.entries(allGroups)){
    // Filter: if any row matches, include the group
    const filtered = rows.filter(r=>{
      if(filterModelVals.size>0 && !filterModelVals.has(r.model)) return false;
      if(activeStages.size>0 && !activeStages.has(r.stage)) return false;
      if(filterCpuVals.size>0 && !filterCpuVals.has(r.cpu)) return false;
      if(filterGpuVals.size>0 && !filterGpuVals.has(r.gpu)) return false;
      if(filterYearVals.size>0 && r.mp_sort && !filterYearVals.has(r.mp_sort.substring(0,4))) return false;
      if(filterMktVals.size>0){const seg=r.mkt.split(' ')[0];if(seg && !filterMktVals.has(seg))return false}
      if(filterSearchVal){
        const q=filterSearchVal.toLowerCase();
        if(!r.model.toLowerCase().includes(q) && !r.mkt.toLowerCase().includes(q)) return false;
      }
      return true;
    });
    if(filtered.length>0) result[model]=filtered;
  }
  return result;
}

function getSortedGroups(groups){
  const entries = Object.entries(groups);
  if(sortKey==='mp'){
    entries.sort((a,b)=>{
      const ma=a[1][0].mp_sort, mb=b[1][0].mp_sort;
      return ma.localeCompare(mb);
    });
  } else if(sortKey==='kickoff'){
    entries.sort((a,b)=>{
      const ka=a[1][0].dates?.['Kickoff']||'9999', kb=b[1][0].dates?.['Kickoff']||'9999';
      return ka.localeCompare(kb);
    });
  } else if(sortKey==='mkt'){
    entries.sort((a,b)=>{
      const ma=a[1][0].mkt||'', mb=b[1][0].mkt||'';
      return ma.localeCompare(mb);
    });
  } else {
    entries.sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  }
  return entries;
}

/* Multi-select dropdown component */
function createMsDropdown(containerId, items, selectedSet, onChange){
  const wrap=document.getElementById(containerId);
  const allChecked=selectedSet.size===0;
  let btnLabel=allChecked?'All':selectedSet.size+' selected';
  let h=`<div class="ms-btn" onclick="toggleMsPanel('${containerId}')">${btnLabel}<span class="ms-arrow">▼</span></div>`;
  h+=`<div class="ms-panel" id="${containerId}_panel">`;
  h+=`<div class="ms-opt all-opt ${allChecked?'checked':''}" onclick="msToggleAll('${containerId}')"><div class="ms-check">✓</div>All</div>`;
  for(const item of items){
    const ck=selectedSet.has(item)?'checked':'';
    h+=`<div class="ms-opt ${ck}" data-val="${escAttr(item)}" onclick="msToggleItem('${containerId}','${escAttr(item)}')"><div class="ms-check">✓</div>${item}</div>`;
  }
  h+=`</div>`;
  wrap.innerHTML=h;
  wrap._items=items;
  wrap._onChange=onChange;
}

function toggleMsPanel(id){
  const panel=document.getElementById(id+'_panel');
  const btn=document.getElementById(id).querySelector('.ms-btn');
  const isOpen=panel.classList.contains('show');
  // close all
  document.querySelectorAll('.ms-panel.show').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.ms-btn.open').forEach(b=>b.classList.remove('open'));
  if(!isOpen){
    panel.classList.add('show');
    btn.classList.add('open');
  }
}

function msToggleAll(id){
  const wrap=document.getElementById(id);
  const set=wrap._onChange();
  set.clear();
  updateMsComponent(id);
  syncStatCards();
  renderList();
}

function msToggleItem(id,val){
  const wrap=document.getElementById(id);
  const set=wrap._onChange();
  if(set.has(val))set.delete(val);else set.add(val);
  updateMsComponent(id);
  syncStatCards();
  renderList();
}

function updateMsComponent(id){
  const wrap=document.getElementById(id);
  if(!wrap||!wrap._onChange)return;
  const set=wrap._onChange();
  const items=wrap._items;
  const allChecked=set.size===0;
  const btn=wrap.querySelector('.ms-btn');
  btn.innerHTML=(allChecked?'All':set.size+' selected')+`<span class="ms-arrow">▼</span>`;
  const panel=document.getElementById(id+'_panel');
  if(!panel)return;
  const opts=panel.querySelectorAll('.ms-opt');
  opts.forEach(o=>{
    if(o.classList.contains('all-opt')){o.classList.toggle('checked',allChecked)}
    else{o.classList.toggle('checked',set.has(o.dataset.val))}
  });
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatSectionText(text){
  if(!text)return 'N/A';
  if(!/\d+[)）]/.test(text))return escHtml(text);
  // 在每個非開頭的「數字)」或「數字）」前斷行
  const formatted=text.replace(/([^\n])(\s*)(\d+[)）])/g,'$1\n$3');
  const parts=formatted.split('\n').map(s=>s.trim()).filter(s=>s);
  if(parts.length<=1)return escHtml(text);
  return parts.map(p=>'<div style="margin-bottom:6px">'+escHtml(p)+'</div>').join('');
}

  var cols=[];
  for(var ci=0;ci<16;ci++){
    var col={wch:wList[ci],outlineLevel:0};
    if(ci>=8 && ci<=12){col.outlineLevel=1;col.hidden=true;}
    cols.push(col);
  }
  ws['!cols']=cols;
  ws['!rows']=rowInfo;
  ws['!outline']={above:true};
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'NPI Dashboard');
  var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});

  // JSZip 补丁：注入 showOutlineSymbols + outlineLevel + summaryBelow
  var zip=await JSZip.loadAsync(new Uint8Array(buf));
  var xml=await zip.file('xl/worksheets/sheet1.xml').async('string');
  xml=xml.replace('<sheetView ','<sheetView showOutlineSymbols="1" ');
  xml=xml.replace(/(<col [^>]*hidden="true")/g,'$1 outlineLevel="1"');
  xml=xml.replace(/ summaryBelow="[^"]*"/g,'');
  if(xml.includes('<outlinePr')){xml=xml.replace('<outlinePr','<outlinePr summaryBelow="0"');}
  else if(xml.includes('<sheetPr')){
    xml=xml.replace(/<sheetPr\s*\/>/,'<sheetPr><outlinePr summaryBelow="0"/></sheetPr>');
    if(!xml.includes('summaryBelow')){xml=xml.replace(/(<sheetPr[^>]*)>/,'$1><outlinePr summaryBelow="0"/>');}
  }
  else{xml=xml.replace('<sheetViews','<sheetPr><outlinePr summaryBelow="0"/></sheetPr><sheetViews');}
  zip.file('xl/worksheets/sheet1.xml',xml);
  var blob=await zip.generateAsync({type:'blob'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='npi_dashboard.xlsx';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

renderStats();initFilters();renderList();
</script>
</body>
</html>
